<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro</title>
  <link rel="stylesheet" href="../public/css/style.css">
  <meta name="description" content="Página de cadastro do site Arte Guiada.">
</head>
<body>
  <header>
    <nav>
      <a href="../index.html">Início</a>
      <a href="../views/login.html">Login</a>
      <a href="../index.html#secao2">O que fazemos</a>
      <a href="../index.html#secao1">Obras</a>
    </nav>
  </header>

  <main>
    <h2>Cadastro e Contato</h2>

    <form id="cadastroForm" novalidate>
      <!-- Campo Nome (Permite nomes compostos) -->
      <label for="nome">Nome:</label><br>
      <input type="text" id="nome" name="nome" required><br>
      <span class="error-msg" id="nome-error"></span><br>

      <!-- Campo Sobrenome -->
      <label for="sobrenome">Sobrenome:</label><br>
      <input type="text" id="sobrenome" name="sobrenome" required><br>
      <span class="error-msg" id="sobrenome-error"></span><br>

      <!-- Campo Email -->
      <label for="email">Email:</label><br>
      <input type="email" id="email" name="email" required><br>
      <span class="error-msg" id="email-error"></span><br>

      <!-- Perfis no Sistema (Radio Buttons) -->
      <fieldset class="perfil-fieldset">
        <legend>Perfil no Sistema:</legend>
        <label><input type="radio" name="loginTipo" value="Visitante" required> Visitante</label><br>
        <label><input type="radio" name="loginTipo" value="Editor"> Editor</label><br>
        <label><input type="radio" name="loginTipo" value="Curador"> Curador</label><br>
        <label><input type="radio" name="loginTipo" value="Estudante"> Estudante</label><br>
        <label><input type="radio" name="loginTipo" value="Professor"> Professor</label><br>
        <label><input type="radio" name="loginTipo" value="Pesquisador"> Pesquisador</label>
      </fieldset>
      <span class="error-msg" id="tipo-error"></span><br>

      <!-- Campo Mensagem -->
      <label for="mensagem">Mensagem / Biografia curta:</label><br>
      <textarea id="mensagem" name="mensagem" rows="3" required></textarea><br>
      <span class="error-msg" id="mensagem-error"></span><br>

      <!-- Campo Senha e Força de Senha -->
      <label for="senha">Senha:</label><br>
      <input type="password" id="senha" name="senha" required><br>
      
      <!-- Barras de Nível de Força de Senha -->
      <div class="strength-container">
        <div id="strength-bar" class="strength-bar"></div>
      </div>
      <span id="strength-text" class="strength-text"></span><br>

      <!-- Campo Confirmar Senha -->
      <label for="confirmaSenha">Confirme a senha:</label><br>
      <input type="password" id="confirmaSenha" name="confirmaSenha" required><br>
      <span class="error-msg" id="password-error"></span><br><br>

      <input type="submit" value="Cadastrar">
    </form>

    <div id="form-feedback" class="feedback-box"></div>
  </main>

  <footer>
    Roberta Ruivo Pompeu
    <a href="mailto:roberta.ruivo@unesp.br">Email</a>
    Sistemas computacionais 2.2026
  </footer>

  <script src="../public/js/cadastro.js"></script>
</body>
</html>
