<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Explore obras de arte e descubra seus detalhes com o Arte Guiada.">

    <title>Arte Guiada | Galeria</title>

    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/painel.css">
    <link rel="stylesheet" href="../public/css/catalogo.css">

    <script src="../public/js/sessao-ui.js" defer></script>
    <script src="../public/js/catalogo.js" defer></script>
</head>

<body class="pagina-painel pagina-catalogo">

    <a class="skip-link-painel" href="#conteudo-principal">
        Pular para o conteúdo
    </a>

    <header class="cabecalho catalogo-cabecalho">

        <nav class="nav-principal catalogo-nav" aria-label="Navegação principal">

            <a href="../index.html" class="logo">
                Arte Guiada
            </a>

            <div class="nav-links catalogo-nav-links">

                <a href="../index.html">
                    Início
                </a>

                <a href="catalogo.html" aria-current="page">
                    Galeria
                </a>

                <a href="acesso.html">
                    Entrar
                </a>

                <button type="button" class="catalogo-busca-toggle" id="toggleBuscaCatalogo" aria-expanded="false"
                    aria-controls="painelBuscaCatalogo" aria-label="Abrir busca de obras">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                        stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="10.8" cy="10.8" r="6.8"></circle>
                        <path d="m16 16 4.5 4.5"></path>
                    </svg>

                    <span>Buscar</span>
                </button>

            </div>

        </nav>

        <div class="catalogo-busca-popover" id="painelBuscaCatalogo" role="search" aria-label="Buscar obras no catálogo"
            hidden>
            <label for="buscaObra">
                Buscar por título ou artista
            </label>

            <input id="buscaObra" name="buscaObra" type="search" placeholder="Digite o título ou artista..."
                autocomplete="off">

            <button type="button" id="fecharBuscaCatalogo" class="catalogo-busca-fechar">
                Fechar
            </button>
        </div>

    </header>

    <main id="conteudo-principal" class="catalogo-pagina">

        <h1 class="catalogo-visualmente-oculto">
            Galeria de obras
        </h1>

        <p id="feedbackCatalogo" class="catalogo-feedback" role="status" aria-live="polite"></p>

        <section class="catalogo-obras-grid" id="catalogoObras" aria-label="Obras disponíveis para exploração"
            aria-busy="true"></section>

    </main>

    <footer class="rodape-painel catalogo-rodape">
        <a class="logo" href="../index.html">Arte Guiada</a>
    </footer>

</body>

</html>
